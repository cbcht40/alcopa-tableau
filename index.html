<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Page hébergée sur un dépôt public : accessible à qui a le lien, mais on la
     tient hors des moteurs de recherche (enchères max = stratégie d'achat). -->
<meta name="robots" content="noindex, nofollow">
<title>Alcopa — bonnes affaires</title>
<style>
:root {
  --fond: #f4f5f7; --carte: #ffffff; --texte: #16181d; --doux: #6b7280;
  --bord: #e3e5ea; --accent: #1f6feb; --accent-doux: #e8f0fe;
  --vert: #0f8a4f; --vert-doux: #e4f5ec; --ambre: #b45309; --ambre-doux: #fdf1de;
  --rouge: #c02626; --rouge-doux: #fdeaea; --ombre: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  --r: 14px;
}
/* Trois états possibles chez le lecteur : thème système (aucun attribut posé),
   thème sombre explicite, thème clair explicite. Les trois sont traités. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { 
    --fond: #0e1116; --carte: #171b22; --texte: #e8eaed; --doux: #9aa3b2;
    --bord: #262c36; --accent: #4d9bff; --accent-doux: #16283f;
    --vert: #43c57e; --vert-doux: #14301f; --ambre: #e0a44a; --ambre-doux: #33260f;
    --rouge: #f2635f; --rouge-doux: #351a1a;
    --ombre: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
 }
}
:root[data-theme="dark"] { 
    --fond: #0e1116; --carte: #171b22; --texte: #e8eaed; --doux: #9aa3b2;
    --bord: #262c36; --accent: #4d9bff; --accent-doux: #16283f;
    --vert: #43c57e; --vert-doux: #14301f; --ambre: #e0a44a; --ambre-doux: #33260f;
    --rouge: #f2635f; --rouge-doux: #351a1a;
    --ombre: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
 }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fond); color: var(--texte);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.enveloppe { max-width: 1400px; margin: 0 auto; padding: 0 24px 64px; }

/* ---------- en-tête ---------- */
header { padding: 32px 0 20px; }
.titre-ligne { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; font-weight: 650; }
.horodatage { color: var(--doux); font-size: 13.5px; }
.horodatage.perime { color: var(--ambre); font-weight: 550; }
.profils { font-size: 13.5px; color: var(--doux); }
.profils b { color: var(--texte); font-weight: 600; }
.profils a { color: var(--accent); text-decoration: none; }
.profils a:hover { text-decoration: underline; }
.resume { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.stat {
  background: var(--carte); border: 1px solid var(--bord); border-radius: var(--r);
  padding: 12px 16px; min-width: 132px; box-shadow: var(--ombre);
}
.stat b { display: block; font-size: 22px; font-weight: 640; letter-spacing: -.02em; }
.stat span { color: var(--doux); font-size: 12.5px; }
.mot {
  margin: 16px 0 0; padding: 12px 15px; background: var(--ambre-doux); color: var(--ambre);
  border-radius: 11px; font-size: 13px; line-height: 1.55; max-width: 95ch;
}
.mot b { font-weight: 620; }
.mot.mot-ok { background: var(--vert-doux); color: var(--vert); }

/* ---------- barre de filtres ---------- */
.barre {
  position: sticky; top: 0; z-index: 20; background: var(--fond);
  padding: 14px 0; margin-bottom: 20px; border-bottom: 1px solid var(--bord);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.champ, select, .segment button {
  font: inherit; color: var(--texte); background: var(--carte);
  border: 1px solid var(--bord); border-radius: 10px; padding: 9px 12px;
}
.champ { min-width: 230px; flex: 1 1 230px; }
.champ:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.segment { display: flex; background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 3px; gap: 3px; }
.segment button { border: 0; background: transparent; padding: 6px 13px; border-radius: 8px; cursor: pointer; color: var(--doux); font-size: 14px; }
.segment button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 550; }
.bouton-clair { border: 1px solid var(--bord); background: var(--carte); border-radius: 10px; padding: 9px 13px; cursor: pointer; color: var(--doux); font: inherit; }
.bouton-clair:hover { color: var(--texte); }

/* ---------- panneau de réglages ---------- */
.reglages {
  background: var(--carte); border: 1px solid var(--bord); border-radius: var(--r);
  padding: 18px 20px; margin-bottom: 20px; box-shadow: var(--ombre);
}
.reglages-tete { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.reglages-tete b { font-size: 15.5px; }
.reglages-tete p { margin: 4px 0 0; color: var(--doux); font-size: 12.5px; max-width: 70ch; }
.curseurs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 18px; }
.curseur label { display: block; font-size: 12.5px; color: var(--doux); margin-bottom: 5px; }
.curseur input, .curseur select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--bord); background: var(--fond); color: var(--texte); }
.curseur input:focus, .curseur select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#pastille:not(:empty) {
  display: inline-block; margin-left: 6px; background: var(--accent); color: #fff;
  border-radius: 20px; padding: 1px 7px; font-size: 11.5px; font-weight: 600;
}

/* ---------- grille ---------- */
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px; }
.carte {
  background: var(--carte); border: 1px solid var(--bord); border-radius: var(--r);
  overflow: hidden; box-shadow: var(--ombre); display: flex; flex-direction: column;
  transition: transform .15s ease, box-shadow .15s ease;
}
.carte:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(16,24,40,.08), 0 16px 40px rgba(16,24,40,.12); }
.photo { position: relative; aspect-ratio: 4/3; background: linear-gradient(135deg, var(--bord), var(--fond)); cursor: pointer; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .absente { position: absolute; inset: 0; display: grid; place-items: center; color: var(--doux); font-size: 13px; }
.score {
  position: absolute; top: 10px; left: 10px; background: rgba(15,17,22,.82);
  color: #fff; border-radius: 9px; padding: 5px 9px; font-size: 13px; font-weight: 640;
  backdrop-filter: blur(6px);
}
.score small { font-weight: 400; opacity: .7; }
.etoile {
  position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border: 0;
  border-radius: 50%; background: rgba(15,17,22,.62); color: #fff; font-size: 16px;
  cursor: pointer; backdrop-filter: blur(6px); line-height: 34px; text-align: center; padding: 0;
}
.etoile.active { background: #f5b301; color: #1a1200; }
.urgence {
  position: absolute; bottom: 10px; left: 10px; border-radius: 8px;
  padding: 5px 9px; font-size: 12.5px; font-weight: 600; backdrop-filter: blur(6px);
}
.u-rouge { background: rgba(192,38,38,.92); color: #fff; }
.u-ambre { background: rgba(180,83,9,.92); color: #fff; }
.u-neutre { background: rgba(15,17,22,.72); color: #fff; }

.corps { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.nom { font-size: 16.5px; font-weight: 620; letter-spacing: -.01em; line-height: 1.3; }
.nom span { display: block; color: var(--doux); font-size: 13px; font-weight: 400; margin-top: 3px; }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.puce { background: var(--fond); border: 1px solid var(--bord); border-radius: 7px; padding: 3px 8px; font-size: 12.5px; color: var(--doux); }
.puce.ok { background: var(--vert-doux); border-color: transparent; color: var(--vert); }
.puce.attention { background: var(--ambre-doux); border-color: transparent; color: var(--ambre); }
.puce.alerte { background: var(--rouge-doux); border-color: transparent; color: var(--rouge); }

.prix { background: var(--fond); border-radius: 11px; padding: 12px 14px; }
.prix .max { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.prix .max b { font-size: 24px; font-weight: 660; letter-spacing: -.025em; }
.prix .max span { color: var(--doux); font-size: 12.5px; }
.prix .detail { display: flex; gap: 14px; margin-top: 8px; color: var(--doux); font-size: 12.5px; flex-wrap: wrap; }
.prix .detail b { color: var(--texte); font-weight: 580; }
.marge-ok b { color: var(--vert); }
.verifier {
  display: inline-block; margin-top: 10px; font-size: 12.5px; color: var(--accent);
  text-decoration: none; font-weight: 550;
}
.verifier:hover { text-decoration: underline; }
/* ---------- calculateur ---------- */
.calc { background: var(--fond); border: 1px solid var(--bord); border-radius: 11px; padding: 14px 16px; margin-bottom: 16px; }
.calc > b { display: block; font-size: 14px; margin-bottom: 11px; }
.calc-champs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.calc-champs label { display: block; font-size: 12px; color: var(--doux); margin-bottom: 4px; }
.calc-champs input {
  width: 100%; font: inherit; font-weight: 560; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
}
.calc-champs input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.calc-option { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12.5px; color: var(--doux); cursor: pointer; }
.calc-detail { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 13px 0 10px; font-size: 12.5px; color: var(--doux); }
.calc-detail b { color: var(--texte); font-weight: 560; }
.calc-note { color: var(--doux); font-size: 11.5px; margin: -4px 0 10px; }
.calc-total { border-top: 1px solid var(--bord); padding-top: 11px; display: grid; gap: 7px; }
.calc-total div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.calc-total span { color: var(--doux); font-size: 13px; }
.calc-total b { font-size: 18px; font-weight: 640; letter-spacing: -.02em; }
.calc-total.bon div:last-child b { color: var(--vert); }
.calc-total.moyen div:last-child b { color: var(--ambre); }
.calc-total.mauvais div:last-child b { color: var(--rouge); }
@media (max-width: 480px) { .calc-champs { grid-template-columns: 1fr; } }

.comparer { background: var(--accent-doux); border-radius: 11px; padding: 13px 15px; margin-bottom: 16px; }
.comparer b { display: block; font-size: 13.5px; margin-bottom: 3px; }
.comparer p { margin: 0 0 11px; color: var(--doux); font-size: 12.5px; }
.comparer .duo { display: flex; gap: 8px; }
.comparer .duo a {
  flex: 1; text-align: center; padding: 9px; border-radius: 9px; font-size: 13.5px;
  font-weight: 550; text-decoration: none; background: var(--carte);
  border: 1px solid var(--bord); color: var(--texte);
}
.comparer .duo a:hover { border-color: var(--accent); color: var(--accent); }

.actions { display: flex; gap: 8px; margin-top: auto; }
.actions a, .actions button {
  flex: 1; text-align: center; padding: 9px 10px; border-radius: 10px; font: inherit;
  font-size: 14px; cursor: pointer; text-decoration: none; border: 1px solid var(--bord);
  background: var(--carte); color: var(--doux);
}
.actions .principal { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 560; flex: 2; }
.actions button:hover { color: var(--texte); }

.vide { text-align: center; padding: 80px 20px; color: var(--doux); }
.vide b { display: block; font-size: 17px; color: var(--texte); margin-bottom: 6px; }

/* ---------- fiche détaillée ---------- */
dialog {
  border: 0; border-radius: 16px; padding: 0; max-width: 620px; width: calc(100% - 40px);
  background: var(--carte); color: var(--texte); box-shadow: 0 24px 64px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(8,10,14,.55); backdrop-filter: blur(3px); }
/* 4/3 = format natif des photos Alcopa : en 16/9 on rognait le toit et les roues */
.fiche-photo { aspect-ratio: 4/3; background: var(--fond); max-height: 46vh; }
.fiche-photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.fiche-corps { padding: 20px 24px 24px; }
.fiche-corps h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.02em; }
.fiche-corps .sous { color: var(--doux); font-size: 13.5px; margin-bottom: 16px; }
.lignes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; margin-bottom: 18px; }
.ligne { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--bord); font-size: 13.5px; }
.ligne span { color: var(--doux); }
.ligne b { font-weight: 580; text-align: right; }
.bloc-ct { background: var(--fond); border-radius: 11px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; }
.bloc-ct b { display: block; margin-bottom: 6px; }
.bloc-ct ul { margin: 0; padding-left: 18px; color: var(--doux); }
.ct-alerte { margin: 0 0 8px; color: var(--ambre); font-weight: 550; }
.fermer { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(15,17,22,.6); color: #fff; font-size: 17px; cursor: pointer; }
@media (max-width: 560px) { .lignes { grid-template-columns: 1fr; } .enveloppe { padding: 0 16px 48px; } }
</style>
</head>
<body>
<div class="enveloppe">
  <header>
    <div class="titre-ligne">
      <h1>Bonnes affaires Alcopa</h1>
      <span class="horodatage" id="horodatage"></span>
      <button class="bouton-clair" id="actualiser" onclick="location.reload()" style="margin-left:auto">Actualiser</button>
    </div>
    <div class="resume" id="resume"></div>
    <p class="mot" id="mot" hidden></p>
  </header>

  <div class="barre">
    <input class="champ" id="recherche" type="search" placeholder="Rechercher un modèle, un lieu…" autocomplete="off">
    <div class="segment" id="segment">
      <button data-cat="tout" aria-pressed="true">Toutes</button>
      <button data-cat="affaire" aria-pressed="false" title="Score ≥ 70 et marge suffisante">Bonnes affaires</button>
      <button data-cat="realiste" aria-pressed="false" title="Enchère max ≥ 55 % du prix marché : atteignable en salle">Réalistes</button>
      <button data-cat="surveiller" aria-pressed="false" title="Passent tous les filtres, sans atteindre le seuil d'alerte">À surveiller</button>
      <button data-cat="favoris" aria-pressed="false">★ Favoris</button>
    </div>
    <select id="lieu"><option value="">Tous les lieux</option></select>
    <select id="tri">
      <option value="score">Trier : score</option>
      <option value="vente">Trier : vente la plus proche</option>
      <option value="marge">Trier : marge décroissante</option>
      <option value="enchere">Trier : enchère max croissante</option>
      <option value="km">Trier : kilométrage croissant</option>
    </select>
    <button class="bouton-clair" id="bascule-masques">Masqués : cachés</button>
    <button class="bouton-clair" id="bascule-reglages">⚙ Réglages<span id="pastille"></span></button>
  </div>

  <section class="reglages" id="reglages" hidden>
    <div class="reglages-tete">
      <div>
        <b>Affiner la recherche</b>
        <p id="portee"></p>
      </div>
      <button class="bouton-clair" id="reinit">Tout réinitialiser</button>
    </div>
    <div class="curseurs" id="curseurs"></div>
  </section>

  <div class="grille" id="grille"></div>
  <div class="vide" id="vide" hidden><b>Aucun véhicule ne correspond</b>Modifie les filtres ou lance un nouveau scan.</div>
</div>

<dialog id="fiche"><button class="fermer" onclick="fiche.close()">✕</button><div id="fiche-contenu"></div></dialog>

<script>
const VEHICULES = [];
const PROFIL = {"nom": "standard", "budget": 15000, "age_min": 2, "age_max": 10, "km_max": 120000, "km_max_diesel": 150000, "score_mini": 55, "autres": ["petit-budget", "large"], "voisins": []};
const COUTS_FIXES = 650;  // dossier + carte grise + nettoyage + annonce
const COUT_CT_A_REFAIRE = 90;
const FRAIS = {"pct": 0.144, "mini": 360, "garantie": 225, "sans": 140, "live": 45};              // barème Alcopa réel (voir scraper/frais.py)

// Frais en sus, en euros. Une vente 100 % web France est frais inclus : la
// dernière enchère est le prix final.
function fraisAcheteur(enchere, v, plafondEnLigne) {
  if (v.frais_inclus) return { total: 0, detail: "vente web : frais inclus" };
  const adj = Math.max(enchere * FRAIS.pct, FRAIS.mini);
  const vente = (v.garantie || v.garantie_mecanique) ? FRAIS.garantie : FRAIS.sans;
  const live = plafondEnLigne ? FRAIS.live : 0;
  const mini = adj === FRAIS.mini ? ` (plancher de ${FRAIS.mini} €)` : "";
  return {
    total: Math.round(adj + vente + live),
    detail: `${Math.round(adj)} € d'adjudication${mini} + ${vente} € de frais de vente`
            + (live ? ` + ${live} € d'enchère plafond` : ""),
  };
}
const PARTAGE = true;          // page destinée à quelqu'un d'autre
const AUTO_MAJ = true;        // site hébergé, republié après chaque scan
const GENERE_LE = "2026-08-30T20:39:03";

const ENERGIES = { ES: "Essence", GO: "Diesel", EL: "Électrique", EH: "Hybride",
                   EE: "Hybride rechargeable", GH: "Hybride diesel", GP: "GPL", GL: "Bicarburation" };
// localStorage peut lever (page ouverte via data:, mode privé strict…) : on
// dégrade en mémoire plutôt que de casser toute la page.
const cle = (s) => "alcopa:" + s;
const lire = (s) => {
  try { return new Set(JSON.parse(localStorage.getItem(cle(s)) || "[]")); }
  catch (e) { return new Set(); }
};
const ecrire = (s, v) => {
  try { localStorage.setItem(cle(s), JSON.stringify([...v])); } catch (e) {}
};
let favoris = lire("favoris"), masques = lire("masques");
let etat = { cat: "tout", texte: "", lieu: "", tri: "score", voirMasques: false };
// La page se recharge toute seule quand un scan a réécrit le fichier : on
// conserve donc filtres et tri, sinon chaque rafraîchissement remettrait la
// vue à zéro sous les yeux de l'utilisateur.
try { Object.assign(etat, JSON.parse(localStorage.getItem(cle("etat")) || "{}")); }
catch (e) {}
const memoriserEtat = () => {
  try { localStorage.setItem(cle("etat"), JSON.stringify(etat)); } catch (e) {}
};

// Réglages libres, appliqués à l'affichage (pas besoin de relancer un scan).
// `test` renvoie true si le véhicule passe ; une valeur vide = critère inactif.
const CURSEURS = [
  { cle: "enchereMax", libelle: "Enchère max ≤ (€)", pas: 500,
    test: (v, n) => (v.enchere_max ?? 1e9) <= n },
  { cle: "enchereMin", libelle: "Enchère max ≥ (€)", pas: 500,
    test: (v, n) => (v.enchere_max ?? 0) >= n },
  { cle: "marcheMax", libelle: "Prix marché ≤ (€)", pas: 1000,
    test: (v, n) => (v.prix_marche ?? 1e9) <= n },
  { cle: "margeMin", libelle: "Marge ≥ (€)", pas: 250,
    test: (v, n) => (v.marge_estimee ?? -1e9) >= n },
  { cle: "anneeMin", libelle: "Année ≥", pas: 1,
    test: (v, n) => (v.annee ?? 0) >= n },
  { cle: "kmMax", libelle: "Kilométrage ≤", pas: 10000,
    test: (v, n) => (v.km ?? 1e9) <= n },
  { cle: "scoreMin", libelle: "Score ≥", pas: 5,
    test: (v, n) => (v.score ?? 0) >= n },
  { cle: "partMarcheMin", libelle: "Enchère ≥ % du marché", pas: 5,
    test: (v, n) => (v.enchere_pct_marche ?? 0) * 100 >= n },
];
const LISTES = [
  { cle: "energie", libelle: "Énergie", options: () => [...new Set(VEHICULES.map(v => v.energie).filter(Boolean))]
      .map(e => [e, ENERGIES[e] || e]), test: (v, x) => v.energie === x },
  { cle: "boite", libelle: "Boîte", options: () => [["AUTO", "Automatique"], ["MANU", "Manuelle"]],
      test: (v, x) => (v.boite || "").startsWith(x) },
  { cle: "cote", libelle: "Origine de la cote", options: () => [["table", "Table cotes.csv"], ["segment", "Estimée par segment"]],
      test: (v, x) => v.cote_source === x },
  { cle: "ct", libelle: "Contrôle technique", options: () => [
        ["favorable", "Favorable uniquement"],
        ["favorable_frais", "Favorable et de moins de 6 mois"],
        ["pas_defavorable", "Tout sauf défavorable"],
        ["defavorable", "Défavorable (contre-visite)"],
        ["volontaire", "Contrôle volontaire seulement"],
        ["inconnu", "Aucun document"]],
      test: (v, x) => {
        const e = etatCT(v).cle;
        if (x === "favorable") return e === "favorable";
        if (x === "favorable_frais") return e === "favorable" && !v.ct_a_refaire;
        if (x === "pas_defavorable") return e !== "defavorable";
        if (x === "defavorable") return e === "defavorable";
        if (x === "volontaire") return e === "volontaire";
        return e === "inconnu";
      } },
];
let reglages = {};
try { reglages = JSON.parse(localStorage.getItem(cle("reglages")) || "{}"); } catch (e) {}

const euro = (n) => n == null ? "—" : new Intl.NumberFormat("fr-FR").format(Math.round(n)) + " €";
const km = (n) => n == null ? "—" : new Intl.NumberFormat("fr-FR").format(n) + " km";

function dateVente(v) {
  if (!v.date_vente) return null;
  const [j, m, a] = v.date_vente.split("/").map(Number);
  return new Date(a, m - 1, j);
}
function joursRestants(v) {
  const d = dateVente(v);
  if (!d) return null;
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  return Math.round((d - auj) / 86400000);
}
function urgence(v) {
  const j = joursRestants(v);
  if (j == null) return { classe: "u-neutre", texte: "Date inconnue" };
  if (j < 0) return { classe: "u-neutre", texte: "Vente passée" };
  if (j === 0) return { classe: "u-rouge", texte: "Vente aujourd'hui" };
  if (j === 1) return { classe: "u-rouge", texte: "Vente demain" };
  if (j <= 3) return { classe: "u-ambre", texte: `Vente dans ${j} jours` };
  return { classe: "u-neutre", texte: `Vente dans ${j} jours` };
}

function visibles() {
  const t = etat.texte.toLowerCase().trim();
  return VEHICULES.filter(v => {
    if (joursRestants(v) != null && joursRestants(v) < 0) return false;
    if (!etat.voirMasques && masques.has(v.id)) return false;
    if (etat.cat === "favoris" && !favoris.has(v.id)) return false;
    if (etat.cat === "realiste" && !(v.enchere_pct_marche >= 0.55)) return false;
    if (etat.cat === "affaire" && v.categorie === "surveiller") return false;
    if (etat.cat === "surveiller" && v.categorie !== "surveiller") return false;
    if (etat.lieu && v.lieu !== etat.lieu) return false;
    if (t && !`${v.titre} ${v.finition || ""} ${v.lieu || ""}`.toLowerCase().includes(t)) return false;
    for (const c of CURSEURS) {
      const n = reglages[c.cle];
      if (n !== "" && n != null && !c.test(v, Number(n))) return false;
    }
    for (const l of LISTES) {
      const x = reglages[l.cle];
      if (x && !l.test(v, x)) return false;
    }
    return true;
  }).sort((a, b) => {
    switch (etat.tri) {
      case "vente": return (joursRestants(a) ?? 999) - (joursRestants(b) ?? 999);
      case "marge": return (b.marge_estimee ?? -1) - (a.marge_estimee ?? -1);
      case "enchere": return (a.enchere_max ?? 1e9) - (b.enchere_max ?? 1e9);
      case "km": return (a.km ?? 1e9) - (b.km ?? 1e9);
      default: return (b.score ?? 0) - (a.score ?? 0);
    }
  });
}

// Le verdict du procès-verbal fait foi. « Aucune majeure détectée » ne veut pas
// dire favorable : un CT peut être défavorable et imposer une contre-visite.
function etatCT(v) {
  if (!v.ct) return { cle: "inconnu", texte: "CT inconnu",
                      puce: `<span class="puce attention">CT inconnu</span>` };
  if (v.ct.type === "volontaire")
    return { cle: "volontaire", texte: "Contrôle volontaire — pas un CT réglementaire",
             puce: `<span class="puce attention">Contrôle volontaire</span>` };
  if (v.ct.favorable === true && !v.ct.majeures.length && !v.ct.critiques.length)
    return { cle: "favorable", texte: "Favorable",
             puce: `<span class="puce ok">CT favorable</span>` };
  if (v.ct.favorable === false) {
    const quoi = v.ct.critiques.length ? "critique"
               : v.ct.majeures.length ? `${v.ct.majeures.length} majeure(s)` : "contre-visite";
    return { cle: "defavorable", texte: `Défavorable ${v.ct.motif || ""}`.trim(),
             puce: `<span class="puce alerte">CT défavorable · ${quoi}</span>` };
  }
  return { cle: "indetermine", texte: "Verdict illisible dans le PV",
           puce: `<span class="puce attention">CT à vérifier</span>` };
}

function puces(v) {
  const p = [];
  if (v.annee) p.push(`<span class="puce">${v.annee}</span>`);
  if (v.km != null) p.push(`<span class="puce">${km(v.km)}</span>`);
  if (v.energie) p.push(`<span class="puce">${ENERGIES[v.energie] || v.energie}</span>`);
  if (v.boite) p.push(`<span class="puce">${v.boite.startsWith("AUTO") ? "Automatique" : "Manuelle"}</span>`);
  if (v.garantie || v.garantie_mecanique) p.push(`<span class="puce ok">Garantie</span>`);
  p.push(etatCT(v).puce);
  if (v.ct_a_refaire) p.push(`<span class="puce attention">CT à repasser</span>`);
  if (v.cote_source === "segment") p.push(`<span class="puce attention">Cote estimée</span>`);
  if (v.prix_marche == null) p.push(`<span class="puce alerte">Sans cote</span>`);
  if (v.categorie === "surveiller") p.push(`<span class="puce">À surveiller</span>`);
  return p.join("");
}

function carte(v) {
  const u = urgence(v);
  const fav = favoris.has(v.id);
  const bas = v.enchere_pct_marche != null && v.enchere_pct_marche < 0.55;
  return `<article class="carte">
    <div class="photo" onclick="ouvrirFiche('${v.id}')">
      ${v.photo ? `<img src="${v.photo}" alt="" loading="lazy">` : `<div class="absente">Pas de photo</div>`}
      <div class="score">${v.score ?? "—"}<small>/100</small></div>
      <button class="etoile ${fav ? "active" : ""}" title="Favori"
              onclick="event.stopPropagation();basculerFavori('${v.id}')">${fav ? "★" : "☆"}</button>
      <div class="urgence ${u.classe}">${u.texte}</div>
    </div>
    <div class="corps">
      <div class="nom">${v.titre}<span>${v.finition || ""}</span></div>
      <div class="puces">${puces(v)}</div>
      <div class="prix">
        <div class="max">
          <b>${euro(v.enchere_max)}</b>
          <span>enchère max conseillée</span>
        </div>
        <div class="detail">
          <span>Marché <b>${euro(v.prix_marche)}</b></span>
          <span class="marge-ok">Marge <b>${euro(v.marge_estimee)}</b></span>
          ${v.prix_actuel ? `<span>Actuel <b>${euro(v.prix_actuel)}</b></span>` : ""}
        </div>
        ${bas ? `<div class="detail"><span class="puce attention">Budget plafonné : ${Math.round(v.enchere_pct_marche * 100)} % du marché, peu probable de l'emporter</span></div>` : ""}
        ${v.comparables && v.comparables.leboncoin ? `<a class="verifier" href="${v.comparables.leboncoin}" target="_blank" rel="noopener"
             onclick="event.stopPropagation()">Vérifier ce prix sur LeBonCoin ↗</a>` : ""}
      </div>
      <div class="actions">
        <a class="principal" href="${v.url}" target="_blank" rel="noopener">Voir l'annonce</a>
        <button onclick="ouvrirFiche('${v.id}')">Détails</button>
        <button onclick="basculerMasque('${v.id}')">${masques.has(v.id) ? "Réafficher" : "Masquer"}</button>
      </div>
    </div>
  </article>`;
}

function ligne(libelle, valeur) {
  return `<div class="ligne"><span>${libelle}</span><b>${valeur}</b></div>`;
}

function ouvrirFiche(id) {
  const v = VEHICULES.find(x => x.id === id);
  if (!v) return;
  const cote = v.cote_source === "segment"
    ? `estimée (segment ${v.cote_segment})`
    : v.cote_source === "table" ? "table cotes.csv" : "aucune";
  const ajust = v.cote_ajust_km ? ` (${v.cote_ajust_km > 0 ? "+" : ""}${Math.round(v.cote_ajust_km * 100)} % km)` : "";
  let ct = "";
  const e = etatCT(v);
  if (v.ct === null) {
    ct = `<div class="bloc-ct"><b>Contrôle technique — aucun CT publié</b>
      L'annonce ne fournit pas de PV : décote renforcée appliquée, et il faudra
      faire passer le contrôle avant de revendre.</div>`;
  } else {
    const l = (t, arr) => arr.length ? `<b>${t}</b><ul>${arr.map(x => `<li>${x}</li>`).join("")}</ul>` : "";
    ct = `<div class="bloc-ct"><b>Contrôle technique — ${e.texte}${v.ct.date ? ", passé le " + v.ct.date : ""}</b>
      ${v.ct_a_refaire ? `<p class="ct-alerte">CT de ${v.ct.age_mois} mois : il faudra le repasser
         (${euro(COUT_CT_A_REFAIRE)}) pour revendre à un particulier, qui exige un CT de moins de 6 mois.</p>` : ""}
      ${v.ct.majeures.length || v.ct.mineures.length
        ? l("Défaillances majeures", v.ct.majeures) + l("Défaillances mineures", v.ct.mineures)
        : "Aucune défaillance relevée."}</div>`;
  }
  document.getElementById("fiche-contenu").innerHTML = `
    <div class="fiche-photo">${v.photo ? `<img src="${v.photo}" alt="">` : ""}</div>
    <div class="fiche-corps">
      <h2>${v.titre}</h2>
      <div class="sous">${[v.finition, (v.lot && v.lot !== "0") ? "lot " + v.lot : null, v.lieu].filter(Boolean).join(" · ")}</div>
      <div class="lignes">
        ${ligne("Score", (v.score ?? "—") + " / 100")}
        ${ligne("Vente", (v.date_vente || "?") + " — " + urgence(v).texte)}
        ${ligne("Année", v.annee || "—")}
        ${ligne("Kilométrage", km(v.km))}
        ${ligne("Énergie", ENERGIES[v.energie] || v.energie || "—")}
        ${ligne("Boîte", v.boite || "—")}
        ${ligne("Prix marché retenu", euro(v.prix_marche) + ajust)}
        ${ligne("Origine de la cote", cote)}
        ${ligne("Enchère max conseillée", euro(v.enchere_max))}
        ${ligne("Part du marché", v.enchere_pct_marche != null ? Math.round(v.enchere_pct_marche * 100) + " %" : "—")}
        ${ligne("Marge estimée", euro(v.marge_estimee))}
        ${ligne("Travaux CT (comptés)", euro(v.remise_obligatoire ?? v.cout_ct))}
        ${ligne("Esthétique (optionnel)", euro(v.remise_optionnelle ?? v.cout_esthetique) + ` · ${v.nb_defauts ?? 0} photos`)}
        ${ligne("Mise à prix", euro(v.mise_a_prix))}
        ${ligne("Frais Alcopa", v.frais_inclus ? "inclus dans l'enchère"
            : `en sus · ${euro(v.frais_estimes)} à l'enchère max`)}
        ${ligne("TVA récupérable", v.tva_recuperable ? "oui" : "non")}
        ${ligne("Garantie", (v.garantie || v.garantie_mecanique) ? "oui" : "non")}
      </div>
      <div class="calc">
        <b>Combien ça me coûte vraiment ?</b>
        <div class="calc-champs">
          <div><label for="c-enchere">Mon enchère (€)</label>
               <input id="c-enchere" type="number" step="50" value="${v.enchere_max ?? 0}"></div>
          <div><label for="c-travaux">Travaux prévus (€)</label>
               <input id="c-travaux" type="number" step="50" value="${v.remise_obligatoire ?? v.cout_ct ?? 0}"></div>
          <div><label for="c-fixes">Carte grise, dossier… (€)</label>
               <input id="c-fixes" type="number" step="50" value="${COUTS_FIXES}"></div>
        </div>
        ${v.frais_inclus ? "" : `<label class="calc-option">
          <input type="checkbox" id="c-live" checked> Enchère plafond depuis le site
          (+${euro(FRAIS.live)})</label>`}
        ${(v.remise_optionnelle ?? 0) > 0 ? `<label class="calc-option">
          <input type="checkbox" id="c-esthetique"> Ajouter l'esthétique
          (${euro(v.remise_optionnelle)}, ${v.nb_defauts ?? 0} photos de défauts)</label>` : ""}
        <div class="calc-sortie" id="c-sortie"></div>
      </div>
      ${v.comparables && v.comparables.leboncoin ? `<div class="comparer">
        <b>Vérifier la cote de ${euro(v.prix_marche)}</b>
        <p>Annonces comparables : ${v.comparables.critere}. La cote de l'algo est une
           estimation — c'est ici qu'on la confirme avant d'enchérir.</p>
        <div class="duo">
          <a href="${v.comparables.leboncoin}" target="_blank" rel="noopener">LeBonCoin ↗</a>
          <a href="${v.comparables.lacentrale}" target="_blank" rel="noopener">LaCentrale ↗</a>
        </div>
        ${v.comparables.leboncoin_large ? `<a class="verifier" href="${v.comparables.leboncoin_large}"
           target="_blank" rel="noopener">Trop peu de résultats ? Élargir à
           « ${v.comparables.critere_large} » ↗</a>` : ""}</div>` : ""}
      ${ct}
      ${(v.avertissements || []).length ? `<div class="bloc-ct"><b>Avertissements</b><ul>${v.avertissements.map(a => `<li>${a}</li>`).join("")}</ul></div>` : ""}
      <div class="actions">
        <a class="principal" href="${v.url}" target="_blank" rel="noopener">Ouvrir l'annonce sur Alcopa</a>
      </div>
    </div>`;
  const calculer = () => {
    const enchere = Number(document.getElementById("c-enchere").value) || 0;
    const fixes = Number(document.getElementById("c-fixes").value) || 0;
    const esth = document.getElementById("c-esthetique");
    const live = document.getElementById("c-live");
    const travaux = (Number(document.getElementById("c-travaux").value) || 0)
                  + (esth && esth.checked ? (v.remise_optionnelle || 0) : 0);
    const f = fraisAcheteur(enchere, v, live ? live.checked : false);
    const frais = f.total;
    const total = enchere + frais + fixes + travaux;
    const marge = v.prix_marche != null ? v.prix_marche - total : null;
    const pctMarge = marge != null && v.prix_marche ? marge / v.prix_marche : null;
    const classe = marge == null ? "" : marge >= 1500 ? "bon" : marge > 0 ? "moyen" : "mauvais";
    document.getElementById("c-sortie").innerHTML = `
      <div class="calc-detail">
        <span>Enchère <b>${euro(enchere)}</b></span>
        <span>+ frais Alcopa <b>${euro(frais)}</b>${enchere ? ` (${Math.round(frais / enchere * 100)} %)` : ""}</span>
        <span>+ carte grise & co <b>${euro(fixes)}</b></span>
        <span>+ travaux <b>${euro(travaux)}</b></span>
      </div>
      <div class="calc-note">${f.detail}</div>
      <div class="calc-total ${classe}">
        <div><span>Je paie en tout</span><b>${euro(total)}</b></div>
        <div><span>Marge sur une revente à ${euro(v.prix_marche)}</span>
             <b>${marge == null ? "cote inconnue" : euro(marge)
                + (pctMarge != null ? ` · ${Math.round(pctMarge * 100)} %` : "")}</b></div>
      </div>`;
  };
  ["c-enchere", "c-travaux", "c-fixes", "c-live", "c-esthetique"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", calculer);
  });
  calculer();
  document.getElementById("fiche").showModal();
}

function basculerFavori(id) {
  favoris.has(id) ? favoris.delete(id) : favoris.add(id);
  ecrire("favoris", favoris); rendre();
}
function basculerMasque(id) {
  masques.has(id) ? masques.delete(id) : masques.add(id);
  ecrire("masques", masques); rendre();
}

function construireReglages() {
  const champs = CURSEURS.map(c => `<div class="curseur">
      <label for="r-${c.cle}">${c.libelle}</label>
      <input id="r-${c.cle}" type="number" step="${c.pas}" placeholder="—"
             value="${reglages[c.cle] ?? ""}" data-cle="${c.cle}">
    </div>`).concat(LISTES.map(l => `<div class="curseur">
      <label for="r-${l.cle}">${l.libelle}</label>
      <select id="r-${l.cle}" data-cle="${l.cle}">
        <option value="">Peu importe</option>
        ${l.options().map(([v, t]) => `<option value="${v}" ${reglages[l.cle] === v ? "selected" : ""}>${t}</option>`).join("")}
      </select>
    </div>`)).join("");
  document.getElementById("curseurs").innerHTML = champs;
  document.getElementById("portee").textContent =
    `Ces réglages trient ce que le dernier scan a déjà collecté : profil « ${PROFIL.nom} », ` +
    `budget ${euro(PROFIL.budget)} tout compris, ${PROFIL.age_min}–${PROFIL.age_max} ans, ` +
    `jusqu'à ${PROFIL.km_max / 1000} k km. Pour sortir de cette enveloppe (des voitures ` +
    `plus vieilles ou moins chères), relance un scan avec un autre profil : ` +
    `run.py --profil ${PROFIL.autres[0] || "large"}`;
}

function rendre() {
  memoriserEtat();
  const liste = visibles();
  const nbReglages = Object.values(reglages).filter(x => x !== "" && x != null).length;
  document.getElementById("pastille").textContent = nbReglages || "";
  document.getElementById("grille").innerHTML = liste.map(carte).join("");
  document.getElementById("vide").hidden = liste.length > 0;

  const actifs = VEHICULES.filter(v => (joursRestants(v) ?? 0) >= 0);
  const stats = [
    ["Bonnes affaires", actifs.filter(v => v.categorie !== "surveiller").length],
    ["Réalistes", actifs.filter(v => v.enchere_pct_marche >= 0.55).length],
    ["À surveiller", actifs.filter(v => v.categorie === "surveiller").length],
    ["Favoris", actifs.filter(v => favoris.has(v.id)).length],
    ["Vente sous 3 jours", actifs.filter(v => (joursRestants(v) ?? 99) <= 3).length],
  ];
  document.getElementById("resume").innerHTML = stats
    .map(([l, n]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
}

function init() {
  const d = new Date(GENERE_LE);
  const heures = (Date.now() - d) / 3600000;
  const el = document.getElementById("horodatage");
  el.textContent = "Données du " + d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit",
      hour: "2-digit", minute: "2-digit" }) + (heures < 1 ? " · à l'instant"
      : ` · il y a ${Math.round(heures)} h`);
  if (PROFIL.voisins.length) {
    el.insertAdjacentHTML("afterend", `<span class="profils">profil <b>${PROFIL.nom}</b> · `
      + PROFIL.voisins.map(p => `<a href="${p.fichier}">${p.nom}</a>`).join(" · ") + `</span>`);
  } else {
    el.textContent += ` · profil ${PROFIL.nom}`;
  }
  if (heures > 30) { el.classList.add("perime"); el.textContent += " — pense à relancer un scan"; }

  if (PARTAGE) {
    document.getElementById("actualiser").hidden = !AUTO_MAJ;
    const mot = document.getElementById("mot");
    mot.hidden = false;
    mot.innerHTML = AUTO_MAJ
      ? `<b>Mis à jour automatiquement.</b> Les enchères en cours sont rechargées
         toutes les 30 minutes, et les nouvelles annonces deux fois par jour. En
         revanche, les prix marché affichés sont des <b>estimations</b>, pas des
         relevés : chaque voiture porte un lien LeBonCoin pour les vérifier avant
         d'enchérir. Le calculateur de chaque fiche montre ce qu'on paie réellement,
         frais Alcopa compris.`
      : `<b>Instantané, pas un site vivant.</b> Cette page fige les enchères Alcopa
         en cours au moment du scan : les ventes indiquées passeront, les prix
         bougeront, et elle ne se mettra pas à jour toute seule. Les prix marché sont
         des <b>estimations</b> — chaque voiture porte un lien LeBonCoin pour les
         vérifier avant d'enchérir. Le calculateur de chaque fiche montre ce qu'on
         paie réellement, frais Alcopa compris.`;
    if (AUTO_MAJ) mot.classList.add("mot-ok");
  }

  const lieux = [...new Set(VEHICULES.map(v => v.lieu).filter(Boolean))].sort();
  document.getElementById("lieu").insertAdjacentHTML("beforeend",
    lieux.map(l => `<option value="${l}">${l}</option>`).join(""));

  const recherche = document.getElementById("recherche");
  recherche.value = etat.texte || "";
  recherche.addEventListener("input", e => { etat.texte = e.target.value; rendre(); });
  const selLieu = document.getElementById("lieu");
  selLieu.value = etat.lieu || "";
  selLieu.addEventListener("change", e => { etat.lieu = e.target.value; rendre(); });
  const selTri = document.getElementById("tri");
  selTri.value = etat.tri || "score";
  selTri.addEventListener("change", e => { etat.tri = e.target.value; rendre(); });
  document.getElementById("segment").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    etat.cat = b.dataset.cat;
    [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
    rendre();
  });
  [...document.getElementById("segment").children].forEach(
    b => b.setAttribute("aria-pressed", b.dataset.cat === etat.cat));
  construireReglages();
  document.getElementById("curseurs").addEventListener("input", e => {
    const c = e.target.dataset.cle;
    if (!c) return;
    if (e.target.value === "") delete reglages[c]; else reglages[c] = e.target.value;
    try { localStorage.setItem(cle("reglages"), JSON.stringify(reglages)); } catch (err) {}
    rendre();
  });
  document.getElementById("bascule-reglages").addEventListener("click", () => {
    const p = document.getElementById("reglages");
    p.hidden = !p.hidden;
    if (!p.hidden) p.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  document.getElementById("reinit").addEventListener("click", () => {
    reglages = {};
    try { localStorage.removeItem(cle("reglages")); } catch (e) {}
    construireReglages(); rendre();
  });
  document.getElementById("bascule-masques").addEventListener("click", e => {
    etat.voirMasques = !etat.voirMasques;
    e.target.textContent = etat.voirMasques ? "Masqués : visibles" : "Masqués : cachés";
    rendre();
  });
  addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault(); document.getElementById("recherche").focus();
    }
  });

  // Rechargement automatique : le fichier est réécrit par les scans (toutes les
  // 30 min pour les prix). On ne recharge qu'une page au repos — jamais pendant
  // qu'on lit une fiche, qu'on tape, ou qu'on vient d'agir.
  if (!PARTAGE || AUTO_MAJ) {
    let derniereAction = Date.now();
    ["click", "keydown", "scroll", "input"].forEach(
      ev => addEventListener(ev, () => { derniereAction = Date.now(); }, { passive: true }));
    setInterval(() => {
      const occupe = document.getElementById("fiche").open
                  || document.activeElement.tagName === "INPUT"
                  || Date.now() - derniereAction < 60_000;
      if (!occupe) location.reload();
    }, 120_000);
  }

  rendre();
}
init();
</script>
</body>
</html>
